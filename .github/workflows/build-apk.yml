name: Build Necro Spirit APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find project and verify files
        shell: bash
        run: |
          set -euo pipefail
          echo 'Repository root:'
          pwd
          echo 'Top-level files:'
          ls -la
          if [ -f pubspec.yaml ] && [ -f lib/main.dart ]; then
            project_dir='.'
          else
            project_dir=''
            while IFS= read -r -d '' candidate; do
              candidate_dir="$(dirname "$candidate")"
              if [ -f "$candidate_dir/lib/main.dart" ] && [ -f "$candidate_dir/assets/necro_spirit_icon.png" ]; then
                if [ -n "$project_dir" ]; then
                  echo 'ERROR: More than one Flutter project was found. Keep only one project in this repository.'
                  exit 1
                fi
                project_dir="$candidate_dir"
              fi
            done < <(find . -mindepth 2 -maxdepth 8 -type f -name pubspec.yaml -not -path './.git/*' -print0)
          fi
          if [ -z "$project_dir" ]; then
            echo 'ERROR: Could not find a Flutter project containing pubspec.yaml, lib/main.dart, and assets/necro_spirit_icon.png.'
            echo 'Upload the CONTENTS of the downloaded ZIP. The project files must be together in the repository root or one single subfolder.'
            echo 'Detected pubspec.yaml files:'
            find . -type f -name pubspec.yaml -not -path './.git/*' -print
            exit 1
          fi
          for file in pubspec.yaml lib/main.dart assets/necro_spirit_icon.png; do
            if [ ! -f "$project_dir/$file" ]; then
              echo "ERROR: Required file missing: $project_dir/$file"
              exit 1
            fi
          done
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Flutter project: $project_dir"

      - name: Print tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --project-name=necro_spirit .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Configure Android app label and permissions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit(f'ERROR: Android manifest not found: {manifest}')
          content = manifest.read_text(encoding='utf-8')
          content = re.sub(r'android:label="[^"]*"', 'android:label="Necro Spirit"', content, count=1)
          match = re.search(r'<manifest\b[^>]*>', content)
          if not match:
              raise SystemExit('ERROR: AndroidManifest.xml has no opening <manifest> tag')
          additions = []
          for permission in ('android.permission.RECORD_AUDIO', 'android.permission.INTERNET'):
              if permission not in content:
                  additions.append(f'    <uses-permission android:name="{permission}" />')
          if additions:
              pos = match.end()
              content = content[:pos] + '\n' + '\n'.join(additions) + content[pos:]
          if 'android.speech.RecognitionService' not in content:
              query = '\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>'
              match = re.search(r'<manifest\b[^>]*>', content)
              pos = match.end()
              content = content[:pos] + query + content[pos:]
          manifest.write_text(content, encoding='utf-8')
          print('Android manifest configured.')
          PYCODE

      - name: Generate launcher icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SPIRIT_API_URL: ${{ vars.SPIRIT_API_URL }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=SPIRIT_API_URL="$SPIRIT_API_URL" --verbose 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: necro-spirit-build-diagnostics
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: necro-spirit-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: necro_spirit
description: Necro Spirit paranormal-themed reflection and Spirit Box prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  sensors_plus: ^6.1.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/necro_spirit_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/necro_spirit_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#030103"
  adaptive_icon_foreground: "assets/necro_spirit_icon.png"
